<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;max-width:480px;margin:0 auto;min-height:100vh}
header{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
header h1{font-size:22px} header h1 span{color:#ff3b5c}
.tabs{display:flex;border-bottom:1px solid #222}
.tabs button{flex:1;padding:12px;background:none;border:none;color:#aaa;font-size:15px;cursor:pointer}
.tabs button.active{color:#fff;border-bottom:2px solid #ff3b5c}
.card{background:#111;margin:10px;border-radius:14px;overflow:hidden;border:1px solid #222}
.card img,.card video{width:100%;display:block;max-height:420px;object-fit:cover}
.card-body{padding:12px}
.btn{background:#ff3b5c;color:#fff;border:none;padding:10px 14px;border-radius:20px;cursor:pointer;width:100%;margin-top:8px;font-weight:bold}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:10px;outline:none}
.post-box{background:#111;padding:12px;margin:10px;border-radius:14px}
.hidden{display:none}
.user-row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #222;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:#ff3b5c;display:flex;align-items:center;justify-content:center;font-weight:bold}
.msg{padding:8px 12px;border-radius:16px;margin:6px 0;max-width:80%}
.me{background:#ff3b5c;margin-left:auto}
.other{background:#222}
#auth{padding:20px}
</style>
</head>
<body>
<header><h1>Swift<span>Chat</span></h1><button id="logoutBtn">Logout</button></header>
<div id="auth">
  <h2 style="margin:10px 0">Welcome to SwiftChat 🔥</h2>
  <p id="debug" style="color:yellow;font-size:12px">JS Loading...</p>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username (for signup)">
  <button class="btn" id="signupBtn">Create Account</button>
  <button class="btn" style="background:#222" id="loginBtn">Login</button>
  <p id="authMsg" style="margin-top:10px;color:#ff8fa0"></p>
</div>
<div id="app" class="hidden">
  <div class="tabs">
    <button class="active" data-tab="feed">Feed</button>
    <button data-tab="reels">Reels</button>
    <button data-tab="chat">Chat</button>
    <button data-tab="profile">Profile</button>
  </div>
  <div id="feedTab">
    <div class="post-box">
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <input type="file" id="postFile" accept="image/*,video/*">
      <button class="btn" id="postBtn">Post</button>
    </div>
    <div id="feed"></div>
  </div>
  <div id="reelsTab" class="hidden">
    <div class="post-box">
      <input type="file" id="reelFile" accept="video/*">
      <input id="reelCaption" placeholder="Reel caption...">
      <button class="btn" id="reelBtn">Upload Reel</button>
    </div>
    <div id="reelsList"></div>
  </div>
  <div id="chatTab" class="hidden">
    <div id="usersList"></div>
    <div id="chatBox" class="hidden" style="padding:10px">
      <button id="backBtn" style="background:none;color:#fff;border:none;margin-bottom:10px">← Back</button>
      <h3 id="chatWith"></h3>
      <div id="messages" style="min-height:250px"></div>
      <input id="msgInput" placeholder="Type message...">
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>
  <div id="profileTab" class="hidden" style="padding:16px">
    <h2 id="profileName">My Profile</h2>
    <p id="profileEmail" style="color:#aaa;margin:6px 0"></p>
    <input type="file" id="avatarFile" accept="image/*">
    <button class="btn" id="avatarBtn">Change Avatar</button>
    <div id="myPosts" style="margin-top:16px"></div>
  </div>
</div>
<script>
document.getElementById('debug').innerText = "JS is WORKING ✅ Tap Create Account";
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";
let supabaseClient = null;
try {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(e){ document.getElementById('authMsg').innerText = "Supabase error: " + e.message; }
let currentUser = null;
let chatUser = null;

document.getElementById('signupBtn').addEventListener('click', async ()=>{
  alert("Button clicked! Trying signup...");
  if(SUPABASE_URL.includes("PASTE")){ document.getElementById('authMsg').innerText="⚠️ You forgot to paste your Supabase URL and Publishable Key! Go to Supabase > Settings > API"; return; }
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const username=document.getElementById('username').value;
  const {data,error}=await supabaseClient.auth.signUp({email,password:pass});
  if(error) return document.getElementById('authMsg').innerText=error.message;
  if(data.user){
    await supabaseClient.from('profiles').insert({id:data.user.id, username, full_name:username});
    document.getElementById('authMsg').innerText="Account created! Now tap Login.";
  }
});
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  alert("Login button clicked!");
  if(SUPABASE_URL.includes("PASTE")){ document.getElementById('authMsg').innerText="⚠️ Paste your Supabase keys first!"; return; }
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(error) return document.getElementById('authMsg').innerText=error.message;
  currentUser=data.user;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadFeed(); loadReels(); loadUsers();
});
document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await supabaseClient.auth.signOut(); location.reload(); });
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>showTab(b.dataset.tab)));
function showTab(t){
  ['feedTab','reelsTab','chatTab','profileTab'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById(t+'Tab').classList.remove('hidden');
  if(t==='feed') loadFeed();
  if(t==='reels') loadReels();
  if(t==='chat') loadUsers();
  if(t==='profile') loadProfile();
}
document.getElementById('postBtn').addEventListener('click', async ()=>{
  const text=document.getElementById('postText').value;
  const file=document.getElementById('postFile').files[0];
  let image_url=null, video_url=null;
  if(file){
    const name=Date.now()+'-'+file.name;
    const {error}=await supabaseClient.storage.from('post-media').upload(name,file);
    if(error) return alert(error.message);
    image_url=supabaseClient.storage.from('post-media').getPublicUrl(name).data.publicUrl;
    if(file.type.startsWith('video')){ video_url=image_url; image_url=null; }
  }
  const {error}=await supabaseClient.from('posts').insert({user_id:currentUser.id, content:text, image_url, video_url});
  if(error) return alert(error.message);
  document.getElementById('postText').value=''; loadFeed(); alert('Posted!');
});
async function loadFeed(){
  const {data}=await supabaseClient.from('posts').select('*, profiles(username)').order('created_at',{ascending:false});
  const feed=document.getElementById('feed'); feed.innerHTML='';
  (data||[]).forEach(p=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<div class="card-body"><b>@${p.profiles?.username||'user'}</b><p style="margin:8px 0">${p.content||''}</p></div>
    ${p.image_url?`<img src="${p.image_url}">`:''}
    ${p.video_url?`<video src="${p.video_url}" controls></video>`:''}
    <div class="card-body"><button onclick="likePost('${p.id}')" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px">❤️ ${p.likes_count||0}</button></div>`;
    feed.appendChild(div);
  });
}
async function likePost(id){
  const {data}=await supabaseClient.from('posts').select('likes_count').eq('id',id).single();
  await supabaseClient.from('posts').update({likes_count:(data?.likes_count||0)+1}).eq('id',id);
  loadFeed();
}
document.getElementById('reelBtn').addEventListener('click', async ()=>{
  const file=document.getElementById('reelFile').files[0];
  const caption=document.getElementById('reelCaption').value;
  if(!file) return alert('Pick a video');
  const name=Date.now()+'-'+file.name;
  const {error}=await supabaseClient.storage.from('reels-media').upload(name,file);
  if(error) return alert(error.message);
  const url=supabaseClient.storage.from('reels-media').getPublicUrl(name).data.publicUrl;
  await supabaseClient.from('reels').insert({user_id:currentUser.id, video_url:url, caption});
  loadReels(); alert('Reel uploaded!');
});
async function loadReels(){
  const {data}=await supabaseClient.from('reels').select('*, profiles(username)').order('created_at',{ascending:false});
  const el=document.getElementById('reelsList'); el.innerHTML='';
  (data||[]).forEach(r=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<video src="${r.video_url}" controls></video><div class="card-body"><b>@${r.profiles?.username||'user'}</b><p>${r.caption||''}</p></div>`;
    el.appendChild(d);
  });
}
async function loadUsers(){
  const {data}=await supabaseClient.from('profiles').select('*').neq('id',currentUser.id);
  const el=document.getElementById('usersList'); el.innerHTML='<h3 style="padding:12px">Chats</h3>';
  (data||[]).forEach(u=>{
    const d=document.createElement('div'); d.className='user-row';
    d.innerHTML=`<div class="avatar">${(u.username||'U')[0].toUpperCase()}</div><div><b>@${u.username}</b><br><small style="color:#aaa">Tap to chat</small></div>`;
    d.onclick=()=>openChat(u); el.appendChild(d);
  });
}
async function openChat(u){
  chatUser=u; document.getElementById('usersList').classList.add('hidden');
  document.getElementById('chatBox').classList.remove('hidden');
  document.getElementById('chatWith').innerText='@'+u.username;
  loadMessages();
}
document.getElementById('backBtn').addEventListener('click', ()=>{ document.getElementById('usersList').classList.remove('hidden'); document.getElementById('chatBox').classList.add('hidden'); });
async function loadMessages(){
  const {data}=await supabaseClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatUser.id}),and(sender_id.eq.${chatUser.id},receiver_id.eq.${currentUser.id})`).order('created_at',{ascending:true});
  const el=document.getElementById('messages'); el.innerHTML='';
  (data||[]).forEach(m=>{
    const d=document.createElement('div'); d.className='msg '+(m.sender_id===currentUser.id?'me':'other'); d.innerText=m.content; el.appendChild(d);
  });
}
document.getElementById('sendBtn').addEventListener('click', async ()=>{
  const content=document.getElementById('msgInput').value; if(!content) return;
  await supabaseClient.from('messages').insert({sender_id:currentUser.id, receiver_id:chatUser.id, content});
  document.getElementById('msgInput').value=''; loadMessages();
});
document.getElementById('avatarBtn').addEventListener('click', async ()=>{
  const file=document.getElementById('avatarFile').files[0]; if(!file) return alert('Pick image');
  const name=Date.now()+'-'+file.name;
  const {error}=await supabaseClient.storage.from('avatars').upload(name,file);
  if(error) return alert(error.message);
  const url=supabaseClient.storage.from('avatars').getPublicUrl(name).data.publicUrl;
  await supabaseClient.from('profiles').update({avatar_url:url}).eq('id',currentUser.id);
  alert('Avatar updated!'); loadProfile();
});
async function loadProfile(){
  const {data}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single();
  if(data){ document.getElementById('profileName').innerText='@'+(data.username||'user'); document.getElementById('profileEmail').innerText=currentUser.email; }
}
</script>
</body>
  </html>
